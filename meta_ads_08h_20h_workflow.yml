name: Meta Ads Telegram (08h / 20h VN)

on:
  schedule:
    - cron: '0 1 * * *'    # 08:00 Asia/Ho_Chi_Minh (GitHub UTC)
    - cron: '0 13 * * *'   # 20:00 Asia/Ho_Chi_Minh (GitHub UTC)
  workflow_dispatch:
    inputs:
      che_do:
        description: 'Chạy thử báo cáo hoặc mở menu'
        type: choice
        required: true
        default: menu
        options:
          - menu
          - yesterday
          - today

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KPI_GIA_MESS: '60000'
      EVENT_NAME: ${{ github.event_name }}
      CRON_SCHEDULE: ${{ github.event.schedule }}
      CHE_DO_INPUT: ${{ inputs.che_do || 'menu' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Run Telegram Ads report
        run: python bot_meta_ads_fix_bao_cao.py
